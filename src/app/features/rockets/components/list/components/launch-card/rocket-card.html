<div
  spxTechBorder
  [corners]="CornerStyle.ALL"
  borderSize="lg"
  [showDecorations]="true"
  [hoverable]="true"
  class="group relative cursor-pointer bg-zinc-950/90 backdrop-blur-xl border border-cyan-400/30 filter drop-shadow-[0_0_8px_rgba(0,255,255,0.08)] overflow-hidden h-full flex flex-col"
>
  <!-- Hover bottom line -->
  <div
    class="absolute bottom-0 left-0 w-0 group-hover:w-full h-px bg-linear-to-r from-cyan-400/0 via-cyan-400/60 to-cyan-400/0 transition-all duration-700 z-20"
  ></div>

  <!-- Header -->
  <div class="relative z-10 p-3 pb-2 border-b border-cyan-400/20">
    <h3 class="text-white font-bold text-xs tracking-wide truncate mb-1">
      {{ rocket().name }}
    </h3>

    <div class="flex items-center justify-between text-xs text-zinc-500">
      <span>
        {{ rocket().first_flight | date: 'MMM d, yyyy' }}
      </span>
      <div class="flex items-center gap-3">
        <span class="text-cyan-400 font-semibold"> {{ rocket().success_rate_pct }}% </span>
        <spx-favorite [id]="rocket().id" [favoriteType]="FavoriteType.ROCKET"></spx-favorite>
      </div>
    </div>
  </div>

  <!-- Image -->
  <div class="flex-1 flex items-center justify-center p-3 bg-black/20">
    <div class="relative">
      <div
        class="absolute inset-0 bg-cyan-400/5 blur-xl group-hover:bg-cyan-400/10 transition-all duration-500"
      ></div>

      <spx-image
        [src]="rocket().flickr_images[0]"
        alt="Rocket"
        class="relative w-20 h-20 md:w-24 md:h-24 object-contain drop-shadow-[0_0_10px_rgba(0,255,255,0.2)] group-hover:drop-shadow-[0_0_20px_rgba(0,255,255,0.4)] transition-all duration-500"
      />
    </div>
  </div>

  <!-- Stats -->
  <div
    class="relative z-10 px-3 py-2 border-t border-cyan-400/10 text-[10px] text-zinc-400 space-y-1"
  >
    <div class="flex justify-between">
      <span>Height</span>
      <span class="text-white">{{ rocket().height.meters }} m</span>
    </div>

    <div class="flex justify-between">
      <span>Engines</span>
      <span class="text-white">{{ rocket().engines.number }}</span>
    </div>

    <div class="flex justify-between">
      <span>Cost</span>
      <span class="text-white"> {{ rocket().cost_per_launch / 1_000_000 }}M $ </span>
    </div>
  </div>

  <!-- Arrow -->
  <div class="relative z-10 px-3 py-1.5 border-t border-cyan-400/10 flex items-center justify-end">
    <span
      class="text-cyan-400/30 group-hover:text-cyan-400/80 transition-colors duration-300 text-lg"
    >
      ›
    </span>
  </div>
</div>
