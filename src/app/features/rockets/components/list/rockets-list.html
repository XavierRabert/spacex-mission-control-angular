<div class="space-y-8">
  <spx-title text="ROCKETS" />

  @if (rockets().error; as e) {
    <div
      class="flex items-center gap-3 p-4 border border-red-400/30 bg-red-400/5 text-red-400 text-sm"
      spxTechBorder
      [corners]="CornerStyle.ALL"
      [showDecorations]="true"
      [borderDecorationsColor]="'border-red-600'"
    >
      ✖ Error: {{ e.message }}
    </div>
  }

  <div
    class="flex items-center gap-3 p-4 border border-red-400/30 bg-red-400/5 text-red-400 text-sm"
    spxTechBorder
    [corners]="CornerStyle.ALL"
    [showDecorations]="true"
    [borderDecorationsColor]="'border-red-600'"
  >
    {{ rockets().value?.length }}
  </div>
  @if (rockets().value; as data) {
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-5 gap-3 md:gap-4">
      @for (rocket of data; track rocket.id) {
        <spx-rocket-card [rocket]="rocket" (click)="onClickDetail(rocket.id)" />
      }
    </div>
  }

  <spx-pagination [key]="currentPaginationKey()!" />
</div>
