<div
  class="group relative cursor-pointer bg-zinc-950/90 backdrop-blur-xl border border-cyan-400/30 shadow-[0_0_30px_rgba(0,255,255,0.12)] hover:shadow-[0_0_50px_rgba(0,255,255,0.25)] hover:border-cyan-400/50 transition-all duration-300 hover:-translate-y-1 overflow-hidden rounded-lg"
>
  <div
    class="absolute inset-0 bg-cyan-400/0 group-hover:bg-cyan-400/5 transition-colors duration-300 pointer-events-none"
  ></div>

  <div class="absolute top-0 left-0 w-6 h-6 border-t border-l border-cyan-400/40"></div>
  <div class="absolute top-0 right-0 w-6 h-6 border-t border-r border-cyan-400/40"></div>
  <div class="absolute bottom-0 left-0 w-6 h-6 border-b border-l border-cyan-400/40"></div>
  <div class="absolute bottom-0 right-0 w-6 h-6 border-b border-r border-cyan-400/40"></div>

  <div class="relative z-10 p-4 pb-3 border-b border-cyan-400/20">
    <h3 class="text-white font-bold text-lg tracking-wide mb-2">
      {{ launch().name }}
    </h3>
    <div class="flex items-center justify-between text-sm">
      <span class="text-zinc-400">
        {{ launch().date_utc | date: 'MMM d, yyyy' }}
      </span>
      <span
        class="flex items-center gap-1.5 font-semibold text-xs"
        [class.text-emerald-400]="launch().success"
        [class.text-red-400]="!launch().success"
      >
        {{ launch().success ? '✔' : '✖' }}
        {{ launch().success ? 'Success' : 'Failed' }}
      </span>
    </div>
  </div>

  <div class="relative z-10 bg-black/40">
    <img [src]="launch().links.patch.small" alt="Launch" class="w-full h-52 object-contain p-6" />
    <div
      class="absolute bottom-0 left-0 w-full h-20 bg-linear-to-t from-zinc-950/80 to-transparent"
    ></div>
  </div>
</div>
