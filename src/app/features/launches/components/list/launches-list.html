<spx-title text="PAST LAUNCHES" />

@if (launches().error; as e) {
  <p class="text-red-400">Error loading launches: {{ e.message }}</p>
}

@if (launches().value; as data) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
    @for (launch of data; track launch.id) {
      <spx-launch-card [launch]="launch" (click)="onClickDetail(launch.id)" />
    }
  </div>
}

<pet-pagination [key]="currentPaginationKey()!" />
