<div
  spxTechBorder
  [corners]="CornerStyle.ALL"
  borderSize="lg"
  [showDecorations]="true"
  class="group relative cursor-pointer bg-zinc-950/90 backdrop-blur-xl border border-cyan-400/30 shadow-[0_0_30px_rgba(0,255,255,0.12)] hover:shadow-[0_0_50px_rgba(0,255,255,0.25)] hover:border-cyan-400/50 transition-all duration-100 hover:-translate-y-1 overflow-hidden"
>
  <div class="relative z-10 p-4 pb-3 border-b border-cyan-400/20">
    <h3 class="text-white font-bold text-lg tracking-wide mb-2">
      {{ launch().name }}
    </h3>
    <div class="flex items-center justify-between text-sm">
      <span class="text-zinc-400">
        {{ launch().date_utc | date: 'MMM d, yyyy' }}
      </span>
      <span
        class="flex items-center gap-1.5 font-semibold text-xs"
        [class.text-emerald-400]="launch().success"
        [class.text-red-400]="!launch().success"
      >
        {{ launch().success ? '✔' : '❌' }}
        {{ launch().success ? 'Success' : 'Failed' }}
      </span>
    </div>
  </div>

  <div class="p-8 flex items-center justify-center">
    <spx-image [src]="launch().links.patch.small" alt="Launch" />
  </div>
</div>
