<div
  spxTechBorder
  [corners]="CornerStyle.ALL"
  borderSize="lg"
  [showDecorations]="true"
  [hoverable]="true"
  class="group relative cursor-pointer bg-zinc-950/90 backdrop-blur-xl border border-cyan-400/30 filter drop-shadow-[0_0_8px_rgba(0,255,255,0.08)] overflow-hidden h-full flex flex-col"
>
  <div class="absolute bottom-0 left-0 w-0 group-hover:w-full h-px bg-linear-to-r from-cyan-400/0 via-cyan-400/60 to-cyan-400/0 transition-all duration-700 z-20"></div>
  <div class="relative z-10 p-3 pb-2 border-b border-cyan-400/20">
    <h3 class="text-white font-bold text-xs tracking-wide truncate mb-1">{{ rocket().name }}</h3>
    <div class="flex items-center justify-between text-xs text-zinc-500">
      <span>{{ rocket().first_flight | date: 'MMM d, yyyy' }}</span>
      <div class="flex items-center gap-3">
        <span class="text-cyan-400 font-semibold">{{ rocket().total_launch_count }} launches</span>
        <spx-favorite [id]="rocket().id" [favoriteType]="FavoriteType.ROCKET"></spx-favorite>
      </div>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center p-3 bg-black/20">
    <spx-image
      [src]="rocket().image || ''"
      alt="Rocket configuration"
      class="relative w-20 h-20 md:w-24 md:h-24 object-contain drop-shadow-[0_0_10px_rgba(0,255,255,0.2)]"
    />
  </div>
  <div class="relative z-10 px-3 py-2 border-t border-cyan-400/10 text-[10px] text-zinc-400 space-y-1">
    <div class="flex justify-between"><span>Manufacturer</span><span class="text-white">{{ rocket().company }}</span></div>
    <div class="flex justify-between"><span>Successful launches</span><span class="text-white">{{ rocket().successful_launches }}</span></div>
  </div>
  <div class="relative z-10 px-3 py-1.5 border-t border-cyan-400/10 flex items-center justify-end">
    <span class="text-cyan-400/30 group-hover:text-cyan-400/80 transition-colors duration-300 text-lg">›</span>
  </div>
</div>
